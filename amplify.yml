version: 1
applications:
  - appRoot: apps/website
    buildPath: /
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - npx turbo run build --filter=website
      artifacts:
        baseDirectory: apps/website/.next
        files:
          - '**/*'
      cache:
        paths:
          - apps/website/.next/cache/**/*
          - node_modules/**/*
          - .pnpm-store/**/*
