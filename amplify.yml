version: 1
applications:
  - appRoot: apps/website
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - corepack enable
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - cd ../.. && npx turbo run build --filter=website
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - ../../node_modules/**/*
          - ../../.pnpm-store/**/*
